<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Acade. DJ and music.">
  <title>Acade</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 43 19'%3E%3Cpath fill='red' d='M0 0h6.44v18H0zM9 1h6.44v18H9zM18 0h6.44v18H18zM27 1h6.44v18H27zM36 0h6.44v18H36z'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    html { background: #000; color-scheme: dark; }
    body { margin: 0; background: #000; }
    .stage {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100svh;
      height: 100dvh;
      overflow: hidden;
    }
    .logo {
      position: relative;
      width: min(200px, 65vw);
      aspect-ratio: 914 / 385;
      touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
    }
    .bar {
      position: absolute;
      top: 0;
      left: calc(var(--x) / 914 * 100%);
      width: calc(130.509 / 914 * 100%);
      height: calc(365.424 / 385 * 100%);
      background: #f00;
      transform-origin: center;
    }
    .bar:nth-child(even) { top: calc(19.5757 / 385 * 100%); }
    .letters {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .intro .letters { opacity: 0; }
    .ready .bar { transition: transform 420ms cubic-bezier(.22, 1, .36, 1); }
    @media (prefers-reduced-motion: reduce) {
      .ready .bar { transition: none; }
      .intro .letters { opacity: 1; }
    }
  </style>
</head>
<body>

    </div>
  </main>
  <script>
    (() => {
      const logo = document.querySelector('.logo');
      const bars = [...logo.querySelectorAll('.bar')];
      const letters = logo.querySelector('.letters');
      const stage = document.querySelector('.stage');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const animations = new Set();
      let intro = true;

      // Finished animations release their layers. Nothing runs continuously at rest.
      async function animate(element, frames, options) {
        const animation = element.animate(frames, { fill: 'both', ...options });
        animations.add(animation);
        try {
          await animation.finished;
        } catch {
          // A resize or motion preference change can finish the intro early.
        } finally {
          animations.delete(animation);
          animation.cancel();
        }
      }

      function finishIntro() {
        intro = false;
        logo.classList.remove('intro');
        logo.classList.add('ready');
        animations.forEach(animation => animation.cancel());
        bars.forEach(bar => bar.style.removeProperty('transform'));
      }

      async function enter() {
        if (reducedMotion.matches || !Element.prototype.animate) {
          finishIntro();
          return;
        }
        logo.classList.add('intro');
        const viewport = stage.getBoundingClientRect();
        const rest = bars.map(bar => bar.getBoundingClientRect());
        const cx = viewport.left + viewport.width / 2;
        const cy = viewport.top + viewport.height / 2;
        // Original Signal: a thin line rises into five peaks, then settles.
        await Promise.all(bars.map((bar, index) => {
          const rect = rest[index];
          const at = (x, y, width, height) => ({
            transform: `translate(${x - rect.left - rect.width / 2}px, ${y - rect.top - rect.height / 2}px) rotate(0deg) scale(${width / rect.width}, ${height / rect.height})`,
            opacity: 1
          });
          const line = at(viewport.left + viewport.width * (index + .5) / 5, cy, viewport.width / 5 + 1, 2);
          return animate(bar, [
            { ...line, opacity: 0 },
            { ...line, offset: .2 },
            { ...line, offset: .5 },
            { ...at(cx + (index - 2) * 40, cy, 28.5, 155 - Math.abs(index - 2) * 26), offset: .76 },
            { transform: 'translate(0px, 0px) rotate(0deg) scale(1, 1)', opacity: 1 }
          ], { duration: 1500, delay: index * 38, easing: 'cubic-bezier(.16, 1, .3, 1)' });
        }));
        if (!intro) return;

        await animate(letters, [
          { opacity: 0, transform: 'translateY(7px)' },
          { opacity: 1, transform: 'translateY(0)' }
        ], { duration: 420, easing: 'cubic-bezier(.16, 1, .3, 1)' });
        if (!intro) return;
        logo.classList.remove('intro');

        // One short phrase, always up for 1/3/5 and down for 2/4, then silence.
        await Promise.all(bars.map((bar, index) => {
          const direction = index % 2 === 0 ? -1 : 1;
          const amount = rest[index].height * .075 * direction;
          return animate(bar, [
            { transform: 'translateY(0)', offset: 0 },
            { transform: `translateY(${amount}px)`, offset: .24 },
            { transform: `translateY(${amount * .15}px)`, offset: .52 },
            { transform: `translateY(${amount * .42}px)`, offset: .72 },
            { transform: 'translateY(0)', offset: 1 }
          ], { duration: 1050, delay: index * 65, easing: 'ease-in-out' });
        }));
        if (intro) finishIntro();
      }

      function moveBars(event) {
        if (intro || reducedMotion.matches) return;
        const bounds = logo.getBoundingClientRect();
        const x = (event.clientX - bounds.left) / bounds.width * 914;
        const position = Math.max(0, Math.min(4, (x - 104.4072) / 182.712));
        const amplitude = bounds.height * .12;
        bars.forEach((bar, index) => {
          // A direct neighbour gets half the movement. Two bars away gets none.
          const influence = Math.max(0, 1 - Math.abs(position - index) / 2);
          const direction = index % 2 === 0 ? -1 : 1;
          bar.style.transform = `translateY(${direction * amplitude * influence}px)`;
        });
      }

      function resetBars() {
        if (intro) return;
        bars.forEach(bar => bar.style.removeProperty('transform'));
      }

      logo.addEventListener('pointermove', moveBars);
      logo.addEventListener('pointerdown', moveBars);
      logo.addEventListener('pointerleave', resetBars);
      logo.addEventListener('pointercancel', resetBars);
      logo.addEventListener('pointerup', event => {
        if (event.pointerType !== 'mouse') resetBars();
      });
      window.addEventListener('blur', resetBars);
      window.addEventListener('resize', () => intro ? finishIntro() : resetBars());
      reducedMotion.addEventListener('change', () => {
        if (intro) finishIntro();
        else resetBars();
      });
      enter().catch(finishIntro);
    })();
  </script>
</body>
</html>
